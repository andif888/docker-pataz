name: Validate image

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build fresh image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          push: false
          tags: docker-pataz:validation
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Test final runtime image
        run: docker run --rm --network none docker-pataz:validation docker-pataz-smoke-test
      - name: Export installed dependency inventory
        run: |
          mkdir -p inventory
          docker run --rm --network none docker-pataz:validation \
            tar -C /usr/local/share/docker-pataz -cf - . | tar -C inventory -xf -
          docker image inspect docker-pataz:validation > inventory/image-inspect.json
          cat inventory/pip-freeze.txt inventory/collections.txt
      - name: Upload dependency inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noble-dependency-inventory
          path: inventory/
          retention-days: 14
