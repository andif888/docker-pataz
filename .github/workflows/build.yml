name: Build and Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    name: Build, test and publish to Docker Hub
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate release tag and image name
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Release tag is not a valid Docker tag" >&2; exit 1;
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build release image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          push: false
          tags: docker-pataz:release-test
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Test before registry login or publishing
        run: docker run --rm --network none docker-pataz:release-test docker-pataz-smoke-test
      - name: Export dependency inventory
        run: |
          mkdir -p inventory
          docker run --rm --network none docker-pataz:release-test \
            tar -C /usr/local/share/docker-pataz -cf - . | tar -C inventory -xf -
          docker image inspect docker-pataz:release-test > inventory/image-inspect.json
      - name: Upload dependency inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-inventory
          path: inventory/
          retention-days: 90
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact image that passed tests
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker tag docker-pataz:release-test "$IMAGE:$TAG"
          docker tag docker-pataz:release-test "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker image inspect "$IMAGE:$TAG" --format '{{json .RepoDigests}}'
